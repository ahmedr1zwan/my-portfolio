<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/dnd.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ahmed Rizwan is a Queen’s University Computer Science student specializing in AI, with experience building full-stack applications, backend services, and developer tools." />
    <script>
      // Apply the palette before the first paint to avoid a light flash.
      (() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const saved = localStorage.getItem('portfolio-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch { /* Fall back to the system preference. */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Ahmed Rizwan | Software Developer &amp; AI Portfolio</title>
  </head>
  <body class="min-h-screen" >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
